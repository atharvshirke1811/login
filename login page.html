
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
            background: lightblue;
        }

        .login {
            background: white;
            padding: 25px;
            width: 250px;
            margin: auto;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin: 8px;
        }

        button {
            background: blue;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

    <div class="login">
        <h2>Login</h2>
        <form>
            <input type="text" placeholder="Username" required>
            <br>
            <input type="password" placeholder="Password" required>
            <br>
            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
